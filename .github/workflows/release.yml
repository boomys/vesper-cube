name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Build
        run: gradle build --no-daemon
      - name: Publish GitHub release with the mod jar
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/vesper-cube-*.jar
          generate_release_notes: true
